<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mente Crítica - Juego interactivo de VIKO. Ejercita tu mente y demuestra tu pensamiento crítico.">
    <title>Mente Crítica | VIKO Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            margin: 40px 0;
        }

        .game-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .game-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .game-header p {
            color: #a78bfa;
            font-size: 1.1rem;
        }

        .game-iframe-container {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .game-iframe-container iframe {
            border: none;
            border-radius: 10px;
        }

        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 2rem;
            }

            .game-iframe-container iframe {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🧠 Mente Crítica</h1>
            <p>Ejercita tu mente y demuestra tu pensamiento crítico. ¿Quién tiene el control?</p>
        </div>

        <div class="game-iframe-container">
            <iframe src="https://scratch.mit.edu/projects/1380359760/embed" allowtransparency="true" width="800" height="664" frameborder="0" scrolling="no" allowfullscreen></iframe>
        </div>

        <div style="text-align: center;">
            <a href="../" class="back-button">← Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
